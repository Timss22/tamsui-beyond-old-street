<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241844"/>
      <stop offset="0.45" stop-color="#7b3fb0"/>
      <stop offset="0.78" stop-color="#ff7a4d"/>
      <stop offset="1" stop-color="#ffb24a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6db"/>
      <stop offset="0.55" stop-color="#ffd277"/>
      <stop offset="1" stop-color="#ffd277" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="372" cy="158" r="92" fill="url(#sun)"/>

  <!-- cable-stayed bridge (single asymmetric mast, like the real Tamkang Bridge) -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <line x1="64" y1="360" x2="448" y2="360" stroke-width="14"/>
    <line x1="176" y1="360" x2="150" y2="118" stroke-width="16"/>
    <g stroke-width="4.5" opacity="0.92">
      <line x1="150" y1="124" x2="232" y2="360"/>
      <line x1="150" y1="124" x2="300" y2="360"/>
      <line x1="150" y1="124" x2="368" y2="360"/>
      <line x1="150" y1="124" x2="436" y2="360"/>
      <line x1="150" y1="124" x2="78"  y2="360"/>
    </g>
  </g>

  <!-- water -->
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.5">
    <line x1="96"  y1="402" x2="180" y2="402" stroke-width="6"/>
    <line x1="232" y1="418" x2="330" y2="418" stroke-width="6"/>
    <line x1="120" y1="436" x2="250" y2="436" stroke-width="6"/>
    <line x1="300" y1="446" x2="404" y2="446" stroke-width="6"/>
  </g>
</svg>
